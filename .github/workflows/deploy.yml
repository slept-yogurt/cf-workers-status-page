name: Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

# webpack 4 在 Node 17+ 下会因 OpenSSL 3 报 ERR_OSSL_EVP_UNSUPPORTED，两个打包步骤都需要
env:
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # wrangler v2+ 读取的是 CLOUDFLARE_ 前缀（v1 时代的 CF_ 前缀已不再生效）
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # 提前给出明确报错，避免 wrangler 只吐一句
      # "Unable to find authentication details" 让人摸不着头脑
      - name: Check required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::缺少仓库 Secret CF_API_TOKEN（Settings → Secrets and variables → Actions）"
            missing=1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::缺少仓库 Secret CF_ACCOUNT_ID（Settings → Secrets and variables → Actions）"
            missing=1
          fi
          exit $missing

      - name: Install dependencies
        run: yarn install

      - name: Build static site
        run: yarn build
        env:
          NODE_ENV: production

      # wrangler v2+ 不再支持 type = "webpack"，worker 需要自己打包。
      # 注意顺序：flareact 的 worker 配置在加载时就会读取
      # out/_flareact/static/build-manifest.json，必须等上一步构建完成。
      # 产物为 dist/main.js，对应 wrangler.toml 里的 main。
      - name: Bundle worker
        run: npx webpack --config node_modules/flareact/configs/webpack.worker.config.js --mode production
        env:
          NODE_ENV: production

      # Workers Sites 在 wrangler v4 中已被移除，必须锁定 v3
      - name: Install wrangler
        run: npm i -g wrangler@3.114.17

      - name: Configure KV namespace
        id: kv
        run: |
          set -euo pipefail
          wrangler kv namespace create KV_STATUS_PAGE || true
          KV_STATUS_PAGE_ID=$(wrangler kv namespace list | node .github/scripts/kv-namespace-id.js)
          echo "KV_STATUS_PAGE id = $KV_STATUS_PAGE_ID"
          echo "id=$KV_STATUS_PAGE_ID" >> "$GITHUB_OUTPUT"
          printf '\n[env.production]\nkv_namespaces = [{binding="KV_STATUS_PAGE", id="%s"}]\n' "$KV_STATUS_PAGE_ID" >> wrangler.toml
          echo "----- 最终 wrangler.toml -----"
          cat wrangler.toml

      - name: Publish
        run: wrangler deploy --env production

      # 必须在 worker 存在之后再写 secret
      - name: Set worker secrets
        env:
          SECRET_SLACK_WEBHOOK_URL: ${{ secrets.SECRET_SLACK_WEBHOOK_URL }}
          SECRET_TELEGRAM_API_TOKEN: ${{ secrets.SECRET_TELEGRAM_API_TOKEN }}
          SECRET_TELEGRAM_CHAT_ID: ${{ secrets.SECRET_TELEGRAM_CHAT_ID }}
          SECRET_DISCORD_WEBHOOK_URL: ${{ secrets.SECRET_DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          for name in SECRET_SLACK_WEBHOOK_URL SECRET_TELEGRAM_API_TOKEN SECRET_TELEGRAM_CHAT_ID SECRET_DISCORD_WEBHOOK_URL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "Secret $name 未设置，写入占位值"
              value="default-gh-action-secret"
            fi
            printf '%s' "$value" | wrangler secret put "$name" --env production
          done

      - name: Cleanup old KV data
        env:
          # gcMonitors.js 读的是 v1 时代的变量名
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ steps.kv.outputs.id }}
        run: yarn kv-gc
